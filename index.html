<style>
:root{--bg:#090d18;--panel:#151d31;--panel2:#202b44;--text:#f8fafc;--muted:#9eabc4;--yellow:#ffd84d;--mint:#5ce6aa;--red:#ff5f6d;--line:#ffffff18}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0,#263865 0,transparent 32%),linear-gradient(#0d1324,#080b13);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overscroll-behavior:none}button{font:inherit;color:inherit;touch-action:manipulation}button:active{transform:scale(.985)}[hidden]{display:none!important}#app{max-width:920px;margin:auto;padding:12px 10px 28px}.head{display:flex;align-items:center;justify-content:space-between}.eyebrow{margin:0 0 4px;color:var(--yellow);font-size:11px;font-weight:900}.head h1{margin:0;font-size:28px}.icon,.back{border:1px solid var(--line);background:#ffffff0b;border-radius:16px;padding:11px 13px}.hero{margin-top:14px;background:linear-gradient(135deg,#ffd84d,#ff8a5c);color:#151923;border-radius:26px;padding:19px;display:grid;grid-template-columns:1fr auto;align-items:center;box-shadow:0 18px 50px #0005}.badge{display:inline-block;background:#151923;color:white;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900}.hero h2{font-size:23px;line-height:1.08;margin:10px 0 6px}.hero p{font-size:12px;line-height:1.45;margin:0}.heroCube{width:72px;height:72px;border-radius:17px;background:#fff4d0;display:grid;place-items:center;font-size:24px;font-weight:1000;box-shadow:inset 0 6px 12px #fff8,0 14px 20px #0003;transform:rotate(8deg)}h3{font-size:16px;margin:22px 2px 10px}.difficulty{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.difficulty button,.char,.event{border:1px solid var(--line);background:var(--panel);border-radius:17px}.difficulty button{padding:12px 5px}.difficulty button strong,.difficulty button small{display:block}.difficulty button small{font-size:9px;color:var(--muted);margin-top:3px}.difficulty .sel,.char.sel{outline:3px solid var(--yellow)}.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.char{padding:10px 4px;text-align:center}.cube{width:50px;height:50px;margin:auto;border-radius:11px;display:grid;place-items:center;color:#20242d;font-weight:1000;box-shadow:inset 0 5px 9px #fff4,0 6px 10px #0004}.char b{display:block;font-size:12px;margin-top:6px}.char small{display:block;font-size:9px;color:var(--muted)}.events{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.event{padding:16px 12px;text-align:left}.event span{font-size:27px}.event b{display:block;margin:7px 0 3px}.event small{font-size:10px;color:var(--muted)}.gameTop{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;margin-bottom:9px}.back{width:48px;height:48px;font-size:21px}.gameTitle small{display:block;color:var(--yellow);font-size:10px;font-weight:900}.gameTitle b{display:block;font-size:18px}.timer{background:#05070dcc;border:1px solid var(--line);border-radius:14px;padding:10px 11px;min-width:82px;text-align:center;font-size:16px;font-weight:1000}.stage{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#111827;box-shadow:0 18px 50px #0007}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:10/7;background:#72c9ff}.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;pointer-events:none}.hudBox{background:#09101edf;border:1px solid #ffffff20;border-radius:14px;padding:7px 9px;min-width:88px}.hudBox span{display:block;font-size:9px;color:#cad3e5}.hudBox b{font-size:17px}.bar{width:120px;height:7px;background:#0009;border-radius:99px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--yellow),#ff8458)}.msg{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%) scale(.9);opacity:0;background:#080d19e8;border:1px solid #ffffff20;border-radius:999px;padding:9px 14px;font-weight:1000;white-space:nowrap;transition:.13s}.msg.show{opacity:1;transform:translate(-50%,-50%) scale(1.03)}.controls{padding-top:11px}.feet{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tap{border:0;border-radius:21px;min-height:105px;background:var(--panel2);font-size:21px;font-weight:1000;box-shadow:inset 0 -8px 0 #0003}.tap.next{background:var(--yellow);color:#151923}.jump{width:100%;border:0;border-radius:21px;min-height:88px;margin-top:9px;background:var(--mint);color:#102018;font-size:24px;font-weight:1000}.jump:disabled{background:#2a344a;color:#7d889f}.traffic{display:flex;justify-content:center;gap:12px;margin-bottom:9px}.light{width:52px;height:52px;border-radius:50%;background:#202638;border:5px solid #090d14}.light.red.on{background:#ff4f5d;box-shadow:0 0 30px #ff4f5dbb}.light.green.on{background:#50e89f;box-shadow:0 0 30px #50e89fbb}.react{width:100%;border:0;border-radius:23px;min-height:160px;background:#273149;font-size:30px;font-weight:1000}.react.go{background:var(--mint);color:#102018}.react.false{background:var(--red)}.hint{text-align:center;color:var(--muted);font-size:11px;margin:9px 0 0;min-height:18px}.result{position:fixed;inset:0;background:#05070ddd;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:13px}.resultCard{width:min(560px,100%);background:#151d31;border:1px solid #ffffff20;border-radius:27px;padding:21px}.resultCard>small{color:var(--yellow);font-weight:900}.resultCard h2{font-size:27px;margin:4px 0}.record{font-size:44px;font-weight:1000;color:var(--yellow);margin:4px 0 13px}.rows{display:grid;gap:6px}.row{display:flex;justify-content:space-between;background:#0c1220;border-radius:12px;padding:10px}.row.me{outline:2px solid var(--yellow)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.actions button{border:0;border-radius:15px;padding:14px;font-weight:1000}.retry{background:var(--yellow);color:#151923}.homeBtn{background:#27334d}@media(max-width:620px){.difficulty{grid-template-columns:repeat(2,1fr)}.events{grid-template-columns:1fr}.event{display:grid;grid-template-columns:auto 1fr;column-gap:11px}.event b{margin:1px 0 3px}.event small{grid-column:2}.hero h2{font-size:21px}.heroCube{width:64px;height:64px}.tap{min-height:100px}}

<body>
<main id="app"><section id="home"><header class="head"><div><p class="eyebrow">세상의 모든 네모가 선수라면?</p><h1>네모 운동회</h1></div><button id="sound" class="icon">🔊</button></header><div class="hero"><div><span class="badge">PLAYTEST 0.6 · STABLE</span><h2>이번엔 엔진 없이,<br>진짜로 돌아가게.</h2><p>외부 게임엔진 없이 한 파일로 구성한 안정화 버전.</p></div><div class="heroCube">•ᴗ•</div></div><h3>AI 난이도</h3><div id="difficulty" class="difficulty"></div><h3>내 네모</h3><div id="chars" class="chars"></div><h3>경기 선택</h3><div class="events"><button class="event" data-game="sprint"><span>🏃</span><b>50m 달리기</b><small>좌·우 발을 번갈아 결승까지</small></button><button class="event" data-game="jump"><span>🪽</span><b>멀리뛰기</b><small>도움닫기 → 구름판 → 착지</small></button><button class="event" data-game="reaction"><span>🚦</span><b>출발 반응 레이스</b><small>초록불에 출발해서 4명이 질주</small></button></div></section><section id="game" hidden><div class="gameTop"><button id="back" class="back">←</button><div class="gameTitle"><small id="round">AI 보통 · 0.6</small><b id="gameName">50m 달리기</b></div><div id="timer" class="timer">READY</div></div><div class="stage"><canvas id="canvas" width="1000" height="700"></canvas><div class="hud"><div class="hudBox"><span id="hudL1">COMBO</span><b id="hudV1">0</b></div><div class="hudBox"><span id="hudL2">SPEED</span><b id="hudV2">0%</b><div class="bar"><i id="bar"></i></div></div></div><div id="msg" class="msg"></div></div><div id="controls" class="controls"></div><p id="hint" class="hint"></p></section></main><div id="result" class="result" hidden><div class="resultCard"><small>경기 종료</small><h2 id="resultTitle"></h2><div id="record" class="record"></div><div id="rows" class="rows"></div><div class="actions"><button id="retry" class="retry">한 판 더</button><button id="homeBtn" class="homeBtn">다른 경기</button></div></div></div>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const canvas=$('#canvas'),ctx=canvas.getContext('2d');const chars=[{id:'sugar',name:'각설탕',c:'#f4edcf',w:54,h:54},{id:'brown',name:'흑설탕',c:'#8b5732',w:54,h:54},{id:'salt',name:'소금',c:'#daf4ff',w:54,h:54},{id:'tofu',name:'두부',c:'#ffe8ae',w:60,h:50},{id:'brick',name:'벽돌',c:'#b9513a',w:68,h:48},{id:'box',name:'택배상자',c:'#b9854d',w:60,h:55},{id:'apt',name:'아파트',c:'#b7a07d',w:50,h:78},{id:'gold',name:'금괴',c:'#e8bd31',w:68,h:44},{id:'safe',name:'금고',c:'#6d7683',w:60,h:60}];const diffs={easy:{label:'느긋',speed:.73,err:.085,react:[360,650],jump:[4.3,6.4]},normal:{label:'보통',speed:.92,err:.05,react:[240,460],jump:[5,7.4]},hard:{label:'빡셈',speed:1.08,err:.028,react:[175,335],jump:[5.8,8.1]},hell:{label:'악마',speed:1.23,err:.014,react:[135,265],jump:[6.4,8.6]}};const S={diff:'normal',char:'sugar',type:null,phase:'home',last:null,combo:0,power:0,lock:false,raf:0,sound:true,data:null};let ac=null;function beep(f=500,d=.06){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}function msg(t,ms=650){const e=$('#msg');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),ms)}function hud(a,b,c,d,bar=0){$('#hudL1').textContent=a;$('#hudV1').textContent=b;$('#hudL2').textContent=c;$('#hudV2').textContent=d;$('#bar').style.width=Math.max(0,Math.min(100,bar))+'%'}function renderHome(){$('#difficulty').innerHTML=Object.entries(diffs).map(([k,v])=>`<button data-d="${k}" class="${S.diff===k?'sel':''}"><strong>${v.label}</strong><small>${k==='easy'?'AI가 자주 실수':k==='normal'?'기본 난이도':k==='hard'?'실수하면 추월':'거의 안 틀림'}</small></button>`).join('');$$('#difficulty button').forEach(b=>b.onclick=()=>{S.diff=b.dataset.d;renderHome()});$('#chars').innerHTML=chars.map(c=>`<button class="char ${S.char===c.id?'sel':''}" data-c="${c.id}"><div class="cube" style="background:${c.c}">•ᴗ•</div><b>${c.name}</b><small>${c.id==='brick'?'대화보다 돌진':c.id==='apt'?'관리비 걸고 뛴다':'네모 선수'}</small></button>`).join('');$$('#chars .char').forEach(b=>b.onclick=()=>{S.char=b.dataset.c;renderHome()})}renderHome();$('#sound').onclick=()=>{S.sound=!S.sound;$('#sound').textContent=S.sound?'🔊':'🔇'};$$('.event').forEach(b=>b.onclick=()=>start(b.dataset.game));$('#back').onclick=goHome;$('#homeBtn').onclick=goHome;$('#retry').onclick=()=>start(S.type);function goHome(){stop();$('#result').hidden=true;$('#game').hidden=true;$('#home').hidden=false;S.phase='home'}function stop(){if(S.raf)cancelAnimationFrame(S.raf);S.raf=0;clearTimeout(S.data?.timer);clearTimeout(S.data?.resultTimer)}function start(type){stop();$('#result').hidden=true;$('#home').hidden=true;$('#game').hidden=false;Object.assign(S,{type,phase:'init',last:null,combo:0,power:0,lock:false,data:{}});$('#round').textContent=`AI ${diffs[S.diff].label} · PLAYTEST 0.6`;const meta={sprint:['50m 달리기','왼발·오른발을 번갈아 눌러 달려!'],jump:['멀리뛰기','도움닫기 후 구름판 직전에 JUMP!'],reaction:['출발 반응 레이스','🔴 기다리다가 🟢 GO! 순간 큰 버튼을 눌러!']}[type];$('#gameName').textContent=meta[0];$('#hint').textContent=meta[1];$('#timer').textContent='READY';type==='sprint'?setupSprint():type==='jump'?setupJump():setupReaction()}function playerChar(){return chars.find(c=>c.id===S.char)}function makeRoster(){const others=chars.filter(c=>c.id!==S.char).sort(()=>Math.random()-.5).slice(0,3);return[playerChar(),...others]}function drawBg(){ctx.fillStyle='#73c9ff';ctx.fillRect(0,0,1000,225);ctx.fillStyle='#253453';ctx.fillRect(0,170,1000,65);for(let x=8;x<1000;x+=18){ctx.fillStyle=['#ffd84d','#ff6c69','#5ce6aa','#fff'][Math.floor(Math.random()*4)];ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(x+x%7,190+x%31,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#f6d79c';ctx.fillRect(0,226,1000,10)}function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function drawNemo(r,t){const c=r.c,x=r.x,y=r.y,run=r.running?Math.sin(t*.02*(r.rate||1)):0;ctx.save();ctx.translate(x,y);ctx.rotate((r.angle||0)*Math.PI/180);ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,c.h*.65+20,c.w*.5,8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3b3030';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-12,c.h/2);ctx.lineTo(-15+run*11,c.h/2+25);ctx.moveTo(12,c.h/2);ctx.lineTo(15-run*11,c.h/2+25);ctx.stroke();ctx.strokeStyle=c.c;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-c.w/2,2);ctx.lineTo(-c.w/2-18-run*8,8);ctx.moveTo(c.w/2,2);ctx.lineTo(c.w/2+18+run*8,8);ctx.stroke();ctx.fillStyle=c.c;roundRect(-c.w/2,-c.h/2,c.w,c.h,10);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#20242d';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(r.face||'•ᴗ•',0,-1);if(r.name){ctx.fillStyle='#111827dd';roundRect(-25,-c.h/2-31,50,20,6);ctx.fill();ctx.fillStyle='white';ctx.font='bold 12px sans-serif';ctx.fillText(r.name,0,-c.h/2-21)}ctx.restore()}function showResults(title,big,rows){$('#resultTitle').textContent=title;$('#record').textContent=big;$('#rows').innerHTML=rows.map((r,i)=>`<div class="row ${r.me?'me':''}"><span><b>${i+1}위</b> · ${r.name}</span><b>${r.value}</b></div>`).join('');$('#result').hidden=false}function feet(j=false){$('#controls').innerHTML=`<div class="feet"><button id="left" class="tap next">👈 왼발</button><button id="right" class="tap">오른발 👉</button></div>${j?'<button id="jump" class="jump" disabled>구름판까지 달려!</button>':''}`;$('#left').onclick=()=>foot('L');$('#right').onclick=()=>foot('R');if(j)$('#jump').onclick=takeoff}function foot(f){if(S.lock||!['run','approach'].includes(S.phase))return;if(S.last===f){stumble();return}S.last=f;S.combo++;S.power=Math.min(100,S.power+5+Math.min(2.5,S.combo*.08));$('#left').classList.toggle('next',f==='R');$('#right').classList.toggle('next',f==='L');hud('COMBO',S.combo,'SPEED',Math.round(S.power)+'%',S.power);S.type==='sprint'?sprintStep():jumpStep()}function stumble(){S.lock=true;S.combo=0;S.power=Math.max(0,S.power-28);hud('COMBO','0','SPEED',Math.round(S.power)+'%',S.power);const p=S.data.runners?S.data.runners[0]:S.data.player;p.angle=72;p.face='×﹏×';msg('발 꼬임! 🤦',500);beep(150,.1);setTimeout(()=>{p.angle=0;p.face='•ᴗ•';S.lock=false;S.last=null;const l=$('#left'),r=$('#right');if(l&&r){l.classList.add('next');r.classList.remove('next')}},430)}function setupSprint(){S.phase='count';feet();$('#left').disabled=$('#right').disabled=true;hud('COMBO','0','SPEED','0%',0);const roster=makeRoster();S.data.runners=roster.map((c,i)=>({c,x:110,y:315+i*82,name:i===0?'나':['민수','지현','철수'][i-1],rate:(.9+Math.random()*.16)*diffs[S.diff].speed,running:false,finish:null,face:'•ᴗ•'}));S.data.finishX=875;let n=3;$('#timer').textContent='3';msg('3');beep(430);const tick=()=>{n--;if(n>0){$('#timer').textContent=n;msg(String(n));beep(430);S.data.timer=setTimeout(tick,650)}else{S.phase='run';$('#timer').textContent='GO!';msg('GO! 달려!',600);beep(850,.1);$('#left').disabled=$('#right').disabled=false;S.data.runners.forEach(r=>r.running=true)}};S.data.timer=setTimeout(tick,650);loop(sprintFrame)}function sprintStep(){const r=S.data.runners[0];r.x=Math.min(S.data.finishX,r.x+25+S.power*.085+Math.min(6,S.combo*.11));if(r.x>=S.data.finishX&&!r.finish){r.finish=performance.now();r.running=false;$('#left').disabled=$('#right').disabled=true;S.phase='coast';msg('내 결승! AI 들어오는 중…',900);S.data.resultTimer=setTimeout(finishSprint,2200)}}function sprintFrame(t){drawBg();ctx.fillStyle='#c55f42';ctx.fillRect(0,235,1000,465);ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(0,275+i*82);ctx.lineTo(1000,275+i*82);ctx.stroke()}ctx.fillStyle='white';ctx.fillRect(S.data.finishX,235,14,465);for(let y=235;y<700;y+=22){ctx.fillStyle=((y/22)|0)%2?'#111':'#fff';ctx.fillRect(S.data.finishX,y,14,11)}if(['run','coast'].includes(S.phase)){S.data.runners.forEach((r,i)=>{if(i===0||r.finish)return;if(Math.random()<diffs[S.diff].err*.01){r.angle=55;setTimeout(()=>r.angle=0,130);return}r.x=Math.min(S.data.finishX,r.x+1.9+r.rate*2.25+(S.phase==='coast'?3.1:0));if(r.x>=S.data.finishX){r.finish=performance.now();r.running=false}});if(S.phase==='coast'&&S.data.runners.every(r=>r.finish))finishSprint()}S.data.runners.forEach(r=>drawNemo(r,t))}function finishSprint(){if(S.phase==='result')return;S.phase='result';clearTimeout(S.data.resultTimer);const rs=S.data.runners,my=rs[0].finish||performance.now();rs.forEach(r=>{if(!r.finish)r.finish=my+(S.data.finishX-r.x)*8});const sorted=[...rs].sort((a,b)=>a.finish-b.finish),base=sorted[0].finish,rows=sorted.map(r=>({name:r.name,me:r.name==='나',value:(5+(r.finish-base)/1000).toFixed(2)+'s'})),rank=sorted.findIndex(r=>r.name==='나')+1;showResults(rank===1?'🏆 스프린트 우승!':`${rank}위!`,rows.find(r=>r.me).value,rows)}function setupJump(){S.phase='approach';feet(true);hud('COMBO','0','SPEED','0%',0);S.data.boardX=665;S.data.runY=450;S.data.player={c:playerChar(),x:105,y:S.data.runY,name:'나',rate:1,running:true,face:'•ᴗ•',angle:0};const[a,b]=diffs[S.diff].jump;S.data.ai=Array.from({length:3},()=>a+Math.random()*(b-a)).sort((x,y)=>y-x);$('#timer').textContent='RUN';loop(jumpFrame)}function jumpStep(){const p=S.data.player;p.x+=23+S.power*.078+Math.min(5,S.combo*.09);const rem=S.data.boardX-p.x;$('#timer').textContent=rem>0?(rem/62).toFixed(1)+'m':'BOARD';if(rem<205){$('#jump').disabled=false;$('#jump').textContent=rem>90?'JUMP 준비!':rem>=-10?'🔥 지금 JUMP!':'늦었다!';if(rem<75&&rem>15)msg('지금 JUMP!',280)}if(p.x>S.data.boardX+15)jumpFoul()}function takeoff(){if(S.phase!=='approach'||$('#jump').disabled)return;const p=S.data.player,err=S.data.boardX-p.x;if(err<-12){jumpFoul();return}S.phase='air';p.running=false;$('#left').disabled=$('#right').disabled=$('#jump').disabled=true;const acc=Math.max(.76,1-Math.max(0,err-5)/260);S.data.vx=(35 :`${rank}위!`,foul?'FOUL':rec.toFixed(2)+'m',rows)}function setupReaction(){S.phase='red';hud('상태','대기','AI',diffs[S.diff].label,0);$('#controls').innerHTML='<div class="traffic"><i id="redLight" class="light red on"></i><i id="greenLight" class="light green"></i></div><button id="react" class="react">🔴 기다려!</button>';$('#react').onclick=reactionPress;const roster=makeRoster();S.data.runners=roster.map((c,i)=>({c,x:155,y:315+i*82,name:i===0?'나':['민수','지현','철수'][i-1],rate:1,running:false,started:false,finish:null,reaction:null,face:'•ᴗ•'}));S.data.finishX=850;$('#timer').textContent='RED';msg('빨간불엔 누르지 마!',900);S.data.timer=setTimeout(reactionGo,1700+Math.random()*2200);loop(reactionFrame)}function reactionGo(){if(S.phase!=='red')return;S.phase='green';S.data.goAt=performance.now();$('#redLight').classList.remove('on');$('#greenLight').classList.add('on');$('#react').textContent='🟢 GO! 지금 눌러!';$('#react').classList.add('go');$('#timer').textContent='GO!';msg('GO!!!',400);beep(950,.08);const[lo,hi]=diffs[S.diff].react;S.data.runners.slice(1).forEach(r=>{r.reaction=lo+Math.random()*(hi-lo);setTimeout(()=>{r.started=true;r.running=true},r.reaction)})}function reactionPress(){const b=$('#react');if(S.phase==='red'){S.phase='false';clearTimeout(S.data.timer);S.data.runners[0].reaction=9999;b.textContent='부정출발! AI 달리는 중…';b.classList.add('false');$('#timer').textContent='FALSE';msg('너무 빨랐다! 😵',700);const[lo,hi]=diffs[S.diff].react;S.data.runners.slice(1).forEach(r=>{r.reaction=lo+Math.random()*(hi-lo);setTimeout(()=>{r.started=true;r.running=true},r.reaction)});S.data.resultTimer=setTimeout(finishReaction,2800)}else if(S.phase==='green'){S.phase='race';const r=S.data.runners[0];r.reaction=performance.now()-S.data.goAt;r.started=true;r.running=true;b.textContent=Math.round(r.reaction)+'ms · 달린다!';hud('반응',Math.round(r.reaction)+'ms','레이스','진행 중',0)}}function reactionFrame(t){drawBg();ctx.fillStyle='#c45e40';ctx.fillRect(0,235,1000,465);ctx.strokeStyle='rgba(255,255,255,.35)'
