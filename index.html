<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0b1020" />
<title>네모 운동회 0.5.1</title>
<link rel="stylesheet" href="./style.css?v=051" />
<style>[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
<main id="app">
  <section id="homeScreen" class="home-screen">
    <header class="home-head">
      <div><p class="eyebrow">세상의 모든 네모가 선수라면?</p><h1>네모 운동회</h1></div>
      <button id="soundBtn" class="icon-btn">🔊</button>
    </header>
    <div class="hero">
      <div><span class="badge">PLAYTEST 0.5.1</span><h2>빈 결과창 버그 수정.<br>AI도 끝까지 달린다.</h2><p>결과창·재시작·AI 결승 진행을 먼저 안정화한 핫픽스 버전.</p></div>
      <div class="hero-cube">•ᴗ•</div>
    </div>
    <h3>AI 난이도</h3><div id="difficultyGrid" class="difficulty-grid"></div>
    <h3>내 네모</h3><div id="charGrid" class="char-grid"></div>
    <h3>경기 선택</h3>
    <div class="event-grid">
      <button class="event" data-event="sprint"><span>🏃</span><b>50m 달리기</b><small>좌·우 발 리듬으로 결승까지</small></button>
      <button class="event featured" data-event="jump"><span>🪽</span><b>멀리뛰기</b><small>도움닫기 → 구름판 → 착지</small></button>
      <button class="event" data-event="reaction"><span>🚦</span><b>출발 반응 레이스</b><small>초록불에 출발! 4명이 같이 뛴다</small></button>
    </div>
  </section>
  <section id="gameScreen" class="game-screen" hidden>
    <div class="game-top">
      <button id="backBtn" class="back-btn">←</button>
      <div class="game-title-wrap"><small id="roundLabel">AI 보통</small><strong id="gameTitle">50m 달리기</strong></div>
      <div id="timer" class="timer">READY</div>
    </div>
    <div class="game-stage">
      <div id="phaserMount"></div>
      <div id="overlayMessage" class="overlay-message"></div>
      <div class="hud">
        <div><span id="hudLeftLabel">COMBO</span><b id="hudLeft">0</b></div>
        <div class="hud-speed"><span id="hudRightLabel">SPEED</span><b id="hudRight">0%</b><i><em id="hudBar"></em></i></div>
      </div>
    </div>
    <div id="controls" class="controls"></div>
    <p id="hint" class="hint"></p>
  </section>
</main>
<div id="resultPanel" class="result-panel" hidden>
  <div class="result-card">
    <small>경기 종료</small><h2 id="resultTitle"></h2><div id="recordBig" class="record-big"></div>
    <div id="resultList" class="result-list"></div>
    <div class="result-actions"><button id="retryBtn" class="primary">한 판 더</button><button id="homeBtn" class="secondary">다른 경기</button></div>
  </div>
</div>
<script src="./app.js?v=051"></script>
<script src="./hotfix051.js?v=051"></script>
</body>
</html>
