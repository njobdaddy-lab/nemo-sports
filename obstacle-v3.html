<div class="wrap"><div class="shell"><header class="top"><button class="back" id="back">←</button><div class="title"><small>NEMO SPORTS · OBSTACLE V3</small><h1>100m 장애물 · 5인전</h1></div><div class="stars">⭐ <span id="stars">0</span></div></header><div class="gamebar"><div class="pill" id="charName">각설탕</div><div class="pill">모든 선수에게 장애물 적용</div><div class="timer" id="timer">READY</div></div><div class="stage"><canvas id="c" width="1280" height="720"></canvas><div class="hud"><div class="hudbox"><span>COMBO</span><b id="combo">0</b></div><div class="hudbox"><span>SPEED</span><b id="speed">0.0</b></div><div class="hudbox"><span>CLEAR</span><b><span id="clear">0</span>/5</b></div><div class="hudbox inputbox"><span>INPUT</span><b id="input">-</b></div><div class="rank" id="rank">5위</div></div><div class="msg" id="msg"></div><div class="progress"><i id="bar"></i></div><div class="countdown" id="countdown">3</div></div><div class="controls"><button class="control" id="left">👈 왼발</button><button class="control jump" id="jump">⬆️ 점프</button><button class="control" id="right">오른발 👉</button></div><p class="tip" id="tip">각 레인에 같은 장애물이 놓여 있고, 라이벌도 직접 점프하거나 들이받아 ㅋㅋ.</p></div></div>

<script>
(()=>{'use strict';const $=s=>document.querySelector(s),C=$('#c'),ctx=C.getContext('2d'),W=1280,H=720;const chars=[{type:'sugar',name:'각설탕',need:0,color:'#f2e5cc'},{type:'brown',name:'흑설탕',need:5,color:'#80503a'},{type:'brick',name:'벽돌',need:10,color:'#b94e41'},{type:'safe',name:'금고',need:18,color:'#7d8997'},{type:'apt',name:'아파트',need:25,color:'#d8b47a'}];const obstacles=[{m:18,t:'hurdle',req:45},{m:36,t:'puddle',req:24},{m:54,t:'box',req:52},{m:72,t:'hurdle',req:45},{m:88,t:'puddle',req:24}];const laneY=[500,545,590,635,680],params=new URLSearchParams(location.search);let stars=Number(localStorage.getItem('nemo-stars-100m')||0),selected=params.get('char')||localStorage.getItem('nemo-obstacle-char')||'sugar',S=null,raf=0;if(!chars.some(c=>c.type===selected&&stars>=c.need))selected='sugar';localStorage.setItem('nemo-obstacle-char',selected);$('#stars').textContent=stars;
function makeAI(c,i){const skills=[.78,.88,.70,.84],base=7.55+i*.23+Math.random()*.32;return{char:c,dist:0,baseSpeed:base,speed:base,skill:skills[i]||.8,finish:null,jumpAt:-9999,stumbleUntil:0,planned:new Map(),checked:new Set(),clear:0,hits:0,wobble:Math.random()*6.28,react:'',reactUntil:0}}function makeState(){const ch=chars.find(c=>c.type===selected)||chars[0],rivals=chars.filter(c=>c.type!==ch.type);return{phase:'count',go:0,last:0,elapsed:0,coastUntil:0,char:ch,p:{dist:0,speed:0,lastFoot:null,lastTap:0,combo:0,perfect:0,jumpAt:-9999,stumbleUntil:0,checked:new Set(),clear:0,hits:0,finish:null},ais:rivals.map(makeAI),msgTimer:0}}function jumpH(at,now,amp){const d=now-at;if(d<0||d>760)return 0;return Math.sin(Math.PI*d/760)*amp}function pJump(now){return jumpH(S.p.jumpAt,now,92)}function aJump(a,now){return jumpH(a.jumpAt,now,86)}function msg(t,ms=420){const e=$('#msg');e.textContent=t;e.classList.add('show');clearTimeout(S.msgTimer);S.msgTimer=setTimeout(()=>e.classList.remove('show'),ms)}function flash(el,label){el.classList.add('press');$('#input').textContent=label;setTimeout(()=>el.classList.remove('press'),110)}function updateButtons(){const on=S&&S.phase==='run'&&performance.now()>=S.p.stumbleUntil;for(const id of ['left','right','jump'])$('#'+id).disabled=!on;$('#left').classList.toggle('next',on&&S.p.lastFoot!=='L');$('#right').classList.toggle('next',on&&S.p.lastFoot==='L')}function pressFoot(f,el){if(!S||S.phase!=='run')return;flash(el,f);const p=S.p,now=performance.now();if(now<p.stumbleUntil)return;if(p.lastFoot===f){p.combo=0;p.speed*=.45;p.lastFoot=null;p.lastTap=0;p.stumbleUntil=now+720;msg('발 꼬임! 😵',720);updateButtons();return}const iv=p.lastTap?now-p.lastTap:0;let gain=1.05;if(!p.lastTap){gain=1.5;p.combo=1;msg('GO! 리듬 시작 🔥')}else if(iv>=120&&iv<=320){gain=1.28;p.combo++;if(Math.abs(iv-210)<=55){p.perfect++;msg('PERFECT!',280)}}else if(iv<100){gain=.28;p.combo=0;msg('너무 빨라!',300)}else{gain=.5;p.combo=Math.max(0,p.combo-1);msg('조금 늦어!',300)}p.speed=Math.min(11.3,p.speed+gain);p.lastFoot=f;p.lastTap=now;updateButtons()}function doJump(el){if(!S||S.phase!=='run')return;flash(el,'JUMP');const now=performance.now();if(now<S.p.stumbleUntil||pJump(now)>5)return;S.p.jumpAt=now;msg('점프! 🪽',260)}function bind(id,fn){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn(el)});el.addEventListener('contextmenu',e=>e.preventDefault())}bind('#left',el=>pressFoot('L',el));bind('#right',el=>pressFoot('R',el));bind('#jump',doJump);
function start(){cancelAnimationFrame(raf);S=makeState();$('#result').classList.remove('show');$('#charName').textContent=S.char.name;$('#timer').textContent='READY';$('#combo').textContent='0';$('#speed').textContent='0.0';$('#clear').textContent='0';$('#rank').textContent='5위';$('#bar').style.width='0%';draw(performance.now());count(3)}function count(n){const e=$('#countdown');e.classList.add('show');e.textContent=n;if(n<=0){e.textContent='GO!';setTimeout(()=>e.classList.remove('show'),350);S.phase='run';S.go=performance.now();S.last=S.go;updateButtons();raf=requestAnimationFrame(loop);return}setTimeout(()=>count(n-1),600)}function planAI(a,now){for(let i=0;i<obstacles.length;i++){if(a.checked.has(i)||a.planned.has(i))continue;const o=obstacles[i],ahead=o.m-a.dist;if(ahead>2.4||ahead<0)continue;const ok=Math.random()<a.skill;a.planned.set(i,ok);if(ok)a.jumpAt=now+(Math.random()-.5)*90;else if(Math.random()<.5)a.jumpAt=now+260+Math.random()*170}}function updateAI(a,dt,now){if(a.finish!=null)return;planAI(a,now);if(now<a.stumbleUntil)a.speed=Math.max(a.baseSpeed*.25,a.speed-7*dt);else a.speed+=(a.baseSpeed-a.speed)*Math.min(1,dt*2.9);const r=.986+Math.sin(now/610+a.wobble)*.02;a.dist=Math.min(100,a.dist+a.speed*r*dt);for(let i=0;i<obstacles.length;i++){const o=obstacles[i];if(a.checked.has(i)||a.dist<o.m)continue;a.checked.add(i);if(aJump(a,now)>=o.req){a.clear++;a.react='✨';a.reactUntil=now+420}else{a.hits++;a.speed*=.44;a.stumbleUntil=now+680;a.react='💥';a.reactUntil=now+680}}if(a.dist>=100)a.finish=(now-S.go)/1000}function loop(now){if(!S||!['run','coast'].includes(S.phase))return;const dt=Math.min(.04,Math.max(.001,(now-S.last)/1000));S.last=now;physics(dt,now);draw(now);if(['run','coast'].includes(S.phase))raf=requestAnimationFrame(loop)}function physics(dt,now){const p=S.p;if(S.phase==='run'){if(now<p.stumbleUntil)p.speed=Math.max(0,p.speed-5.8*dt);else{const idle=p.lastTap?now-p.lastTap:9999;p.speed=Math.max(0,p.speed-(idle>520?1.65:.38)*dt)}p.dist=Math.min(100,p.dist+p.speed*dt);for(let i=0;i<obstacles.length;i++){const o=obstacles[i];if(p.checked.has(i)||p.dist<o.m)continue;p.checked.add(i);if(pJump(now)>=o.req){p.clear++;msg('클리어! ✨',350)}else{p.hits++;p.speed*=.5;p.combo=0;p.lastFoot=null;p.lastTap=0;p.stumbleUntil=now+650;msg('쿵! 장애물 충돌 💥',650)}}}for(const a of S.ais)updateAI(a,dt,now);S.elapsed=(now-S.go)/1000;if(S.phase==='run'){const rank=1+S.ais.filter(a=>a.dist>p.dist).length;$('#rank').textContent=rank+'위';$('#timer').textContent=S.elapsed.toFixed(2)+'s';$('#combo').textContent=p.combo;$('#speed').textContent=p.speed.toFixed(1);$('#clear').textContent=p.clear;$('#bar').style.width=Math.min(100,p.dist)+'%';updateButtons();if(p.dist>=100){p.finish=S.elapsed;S.phase='coast';S.coastUntil=now+3800;p.speed=0;$('#timer').textContent=p.finish.toFixed(2)+'s · FINISH';$('#tip').textContent='완주! 상대 선수들도 남은 장애물을 넘으며 들어오는 중...';msg('FINISH! 🏁',600);updateButtons()}}if(S.phase==='coast'){const done=S.ais.every(a=>a.finish!=null);if(done||now>=S.coastUntil){for(const a of S.ais)if(a.finish==null)a.finish=S.elapsed+(100-a.dist)/Math.max(4.5,a.speed);showResult()}}}function showResult(){if(S.phase==='finished')return;S.phase='finished';cancelAnimationFrame(raf);const racers=[{me:true,char:S.char,finish:S.p.finish,clear:S.p.clear,hits:S.p.hits,name:'나 · '+S.char.name},...S.ais.map(a=>({me:false,char:a.char,finish:a.finish,clear:a.clear,hits:a.hits,name:a.char.name}))].sort((a,b)=>a.finish-b.finish);racers.forEach((r,i)=>r.rank=i+1);const me=racers.find(r=>r.me),rank=me.rank,reward=Math.max(1,(rank===1?2:0)+(S.p.hits===0?2:0)+(S.p.clear>=4?1:0));stars+=reward;localStorage.setItem('nemo-stars-100m',String(stars));$('#stars').textContent=stars;const key='nemo-obstacle-pb-'+S.char.type,old=Number(localStorage.getItem(key)||0),isPB=!old||S.p.finish<old;if(isPB)localStorage.setItem(key,String(S.p.finish));$('#resultTitle').textContent=rank===1?'1위! 장애물 정복 🏆':rank+'위 완주!';$('#record').textContent=S.p.finish.toFixed(2)+'s';$('#rRank') function worldX(m){return 260+(m-S.p.dist)*24}function draw(now){ctx.clearRect(0,0,W,H);drawEnv();drawRace(now)}function drawEnv(){ctx.fillStyle='#79cfee';ctx.fillRect(0,0,W,300);ctx.fillStyle='#fff';for(let i=0;i<7;i++){const x=((i*230-S.p.dist*7)%1500+1500)%1500-100;ctx.globalAlpha=.75;ctx.beginPath();ctx.ellipse(x,100+(i%3)*42,58,18,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#5f86a0';ctx.beginPath();ctx.moveTo(0,315);for(let x=0;x<=W;x+=120)ctx.lineTo(x,255+Math.sin(x*.009)*30);ctx.lineTo(W,365);ctx.lineTo(0,365);ctx.fill();ctx.fillStyle='#173858';ctx.fillRect(0,315,W,132);ctx.fillStyle='#f4d867';for(let y=335;y<425;y+=18)for(let x=10;x<W;x+=18)if((x+y)%54<20)ctx.fillRect(x,y,5,5);ctx.fillStyle='#e9eef2';ctx.fillRect(0,447,W,15);ctx.fillStyle='#c85c4e';ctx.fillRect(0,462,W,258);ctx.strokeStyle='#ffffffa8';ctx.lineWidth=2;for(const y of [520,565,610,655,700]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}function drawRace(now){const runners=[{p:S.p,char:S.char,y:laneY[0],me:true},...S.ais.map((a,i)=>({p:a,char:a.char,y:laneY[i+1],me:false}))];for(const r of runners){for(const o of obstacles){const x=worldX(o.m);if(x>-90&&x<W+90)drawObstacle(o,x,r.y)}const j=r.me?pJump(now):aJump(r.p,now);drawNemo(r.p.dist,r.y,r.char,j,now,r.me,now<r.p.stumbleUntil,r.p.react,now<r.p.reactUntil)}const fx=worldX(100);if(fx>-50&&fx<W+80){ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(fx,455);ctx.lineTo(fx,718);ctx.stroke();ctx.fillStyle='#111';for(let y=465;y<710;y+=24)for(let k=0;k<2;k++)ctx.fillRect(fx-14+k*14,y+(k%2?12:0),14,12)}}function drawObstacle(o,x,y){const bottom=y+18;ctx.save();if(o.t==='puddle'){ctx.fillStyle='#64c4ebdd';ctx.beginPath();ctx.ellipse(x,bottom-4,34,9,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#bdeeffaa';ctx.lineWidth=2;ctx.stroke()}else if(o.t==='hurdle'){ctx.strokeStyle='#f4f2e5';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-23,bottom);ctx.lineTo(x-23,bottom-38);ctx.lineTo(x+23,bottom-38);ctx.lineTo(x+23,bot
