<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>네모 운동회 Race Lab</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#06101e;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}body{display:flex;justify-content:center;min-height:100vh}.lab{position:relative;width:min(100vw,760px);aspect-ratio:2/3;overflow:hidden;background:#1a6bc7}.bg{position:absolute;inset:0;background:url('./assets/stadium075.svg?v=1') center/cover no-repeat;filter:saturate(1.06) contrast(1.03)}.shade{position:absolute;inset:0;background:linear-gradient(#02132835 0 12%,transparent 22% 68%,#04101bdc 93% 100%)}.hud{position:absolute;left:2.2%;right:2.2%;top:1.4%;display:grid;grid-template-columns:1fr 1.15fr .95fr;gap:1.3%;z-index:10}.panel{background:linear-gradient(180deg,#123f88ee,#071c43ee);border:3px solid #48baff;border-radius:18px;box-shadow:0 5px 0 #041739,0 7px 20px #00152d80,inset 0 2px 8px #ffffff50;text-shadow:0 2px 0 #000}.combo{transform:rotate(-2deg);padding:7% 8% 5%;text-align:center;border-color:#ffd74f}.combo b{display:block;font-size:clamp(22px,6vw,48px);line-height:.9;color:#ffe04b}.combo small,.distance small{font-weight:1000;font-size:clamp(9px,2.5vw,17px)}.speed{padding:5% 7% 6%;text-align:center}.meter{height:18px;border-radius:999px;background:linear-gradient(90deg,#25e6a6 0 25%,#cfe82f 25% 50%,#ffd433 50% 72%,#ff5c3d 72% 100%);border:3px solid #061633;box-shadow:inset 0 2px 3px #0008;margin-top:4px}.speed b{font-size:clamp(24px,6.5vw,52px);color:#ffd94c}.distance{padding:7% 6%;text-align:center;border-color:#e8f3ff}.distance b{font-size:clamp(22px,6vw,48px);color:#ffdf4c}.pause{position:absolute;right:2.5%;top:10.2%;z-index:11;width:10%;aspect-ratio:1;border-radius:50%;border:3px solid #8dd5ff;background:linear-gradient(#225eac,#0b2c61);box-shadow:0 5px 0 #041739;display:grid;place-items:center;font-size:clamp(15px,4vw,30px);font-weight:1000}.rank{position:absolute;left:1.6%;top:16%;z-index:9;width:18%;display:grid;gap:6px}.r{height:8.2vw;max-height:58px;min-height:34px;border-radius:12px;background:#081a37dd;border:2px solid #ffffff44;display:grid;grid-template-columns:28% 1fr;align-items:center;padding:3px;box-shadow:0 4px 10px #0006}.r.me{border-color:#ffd84d;box-shadow:0 0 0 2px #ffd84d33,0 4px 12px #0007}.r strong{text-align:center;color:#ffd84d;font-size:clamp(11px,2.8vw,20px)}.mini{aspect-ratio:1;border-radius:20%;display:grid;place-items:center;color:#111;font-weight:1000;font-size:clamp(9px,2.3vw,17px);box-shadow:inset 0 3px 4px #fff8,0 3px 5px #0007}.m1{background:#f7efe2}.m2{background:#8a4f2c;color:#fff}.m3{background:#cb563b;color:#fff}.m4{background:#717a86;color:#fff}.runner{position:absolute;z-index:5;transform-origin:50% 80%;filter:drop-shadow(0 10px 8px #0005)}.cube{position:relative;width:100%;height:100%;border-radius:18%;display:grid;place-items:center;border:4px solid #ffffffcc;box-shadow:inset 0 8px 18px #fff7,inset 0 -8px 18px #0002}.cube:before,.cube:after{content:'';position:absolute;width:24%;height:26%;bottom:-15%;border-radius:50%;background:inherit;border:3px solid #ffffffbb;box-shadow:inset 0 -3px 5px #0002}.cube:before{left:12%;transform:rotate(28deg)}.cube:after{right:12%;transform:rotate(-28deg)}.arm{position:absolute;width:28%;height:24%;top:45%;border-radius:50%;background:inherit;border:3px solid #ffffffbb;box-shadow:inset 0 -3px 5px #0002}.al{left:-19%;transform:rotate(-22deg)}.ar{right:-19%;transform:rotate(28deg)}.face{position:relative;width:58%;height:42%}.eye{position:absolute;top:5%;width:24%;height:36%;background:#21120e;border-radius:50%;box-shadow:inset 4px 4px 0 #fff}.e1{left:8%}.e2{right:8%}.mouth{position:absolute;left:35%;top:48%;width:30%;height:28%;background:#b82d2f;border:3px solid #1c1010;border-radius:0 0 50% 50%}.brow{position:absolute;top:-10%;width:26%;height:5%;background:#231613;border-radius:999px}.b1{left:5%;transform:rotate(12deg)}.b2{right:5%;transform:rotate(-12deg)}.player{width:24%;aspect-ratio:1;left:48%;top:57%;transform:rotate(-6deg)}.player .cube{background:radial-gradient(circle at 20% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#fff 0 1px,transparent 2px),linear-gradient(145deg,#fffef7,#e8d7c2)}.brown{width:13%;aspect-ratio:1;left:28%;top:53%;transform:rotate(-5deg)}.brown .cube{background:linear-gradient(145deg,#aa6236,#73401f)}.brick{width:12%;aspect-ratio:1;left:40%;top:49%;transform:rotate(6deg)}.brick .cube{background:linear-gradient(145deg,#ef6d4f,#a9382b)}.safe{width:11%;aspect-ratio:1;left:69%;top:50%;transform:rotate(4deg)}.safe .cube{background:linear-gradient(145deg,#9ca5b0,#59616b)}.safe .dial{position:absolute;width:38%;height:38%;border-radius:50%;border:5px solid #323841;background:#aeb6bf;box-shadow:inset 0 0 0 5px #69727c}.dust{position:absolute;z-index:4;width:18%;height:6%;border-radius:50%;background:radial-gradient(circle,#fff9 0 10%,#f7e0c090 11% 25%,transparent 60%);filter:blur(1px)}.d1{left:42%;top:76%;transform:rotate(-8deg);width:30%}.d2{left:21%;top:65%}.d3{left:36%;top:59%;width:13%}.d4{left:66%;top:59%;width:12%}.progress{position:absolute;z-index:10;left:24%;right:24%;bottom:11.7%;height:4.4%;min-height:24px;background:#081b3ee8;border:3px solid #fff;border-radius:999px;box-shadow:0 5px 0 #04142c,0 8px 15px #0007}.fill{position:absolute;left:3%;top:26%;bottom:26%;width:63%;background:linear-gradient(90deg,#3ddb67,#ffdc30 60%,#ff6847);border-radius:999px}.marker{position:absolute;left:61%;top:50%;transform:translate(-50%,-50%);width:9%;aspect-ratio:1;border-radius:25%;background:#fff3df;border:3px solid #438cff;display:grid;place-items:center;color:#222;font-size:clamp(7px,2vw,14px);font-weight:1000}.flag{position:absolute;right:-2%;bottom:50%;transform:translateY(50%);font-size:clamp(18px,5vw,40px)}.controls{position:absolute;z-index:12;left:2.2%;right:2.2%;bottom:1.8%;display:flex;justify-content:space-between;align-items:end}.foot{width:25%;aspect-ratio:1;border-radius:50%;border:5px solid #d7f2ff;color:#fff;font-weight:1000;font-size:clamp(14px,4vw,30px);box-shadow:0 8px 0 #06162f,0 0 22px currentColor,inset 0 7px 16px #fff6;display:grid;place-items:center;text-shadow:0 2px 0 #000}.left{background:linear-gradient(145deg,#1cb9ff,#1260d8)}.right{background:linear-gradient(145deg,#ff4d92,#d3195b)}.foot:active{transform:translateY(5px);box-shadow:0 3px 0 #06162f,0 0 12px currentColor,inset 0 5px 12px #fff6}.foot span{display:block;text-align:center}.foot em{font-style:normal;font-size:1.45em}.caption{position:absolute;left:50%;bottom:6.6%;transform:translateX(-50%);z-index:12;font-weight:1000;background:#07152bdc;border:2px solid #ffffff44;border-radius:999px;padding:5px 12px;font-size:clamp(8px,2.2vw,15px);white-space:nowrap}@media(min-width:760px){.r{height:52px}.rank{width:135px}.pause{width:70px}.player{width:175px}.brown{width:95px}.brick{width:88px}.safe{width:82px}}</style></head><body><main class="lab"><div class="bg"></div><div class="shade"></div><div class="hud"><div class="panel combo"><small>⚡ COMBO</small><b>×4</b></div><div class="panel speed"><small>SPEED</small><b>87</b><div class="meter"></div></div><div class="panel distance"><small>🏁 DISTANCE</small><b>32m</b><small>/ 50m</small></div></div><button class="pause">Ⅱ</button><div class="rank"><div class="r me"><strong>1P</strong><div class="mini m1">•ᴗ•</div></div><div class="r"><strong>2P</strong><div class="mini m2">•̀ᴗ•́</div></div><div class="r"><strong>3P</strong><div class="mini m3">•̀_•́</div></div><div class="r"><strong>4P</strong><div class="mini m4">◉</div></div></div><div class="runner brown"><div class="cube"><span class="arm al"></span><span class="arm ar"></span><div class="face"><i class="brow b1"></i><i class="brow b2"></i><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div></div></div><div class="runner brick"><div class="cube"><span class="arm al"></span><span class="arm ar"></span><div class="face"><i class="brow b1"></i><i class="brow b2"></i><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div></div></div><div class="runner safe"><div class="cube"><span class="arm al"></span><span class="arm ar"></span><div class="dial"></div></div></div><div class="runner player"><div class="cube"><span class="arm al"></span><span class="arm ar"></span><div class="face"><i class="brow b1"></i><i class="brow b2"></i><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div></div></div><div class="dust d1"></div><div class="dust d2"></div><div class="dust d3"></div><div class="dust d4"></div><div class="progress"><div class="fill"></div><div class="marker">•ᴗ•</div><div class="flag">🏁</div></div><div class="caption">중간 레이스 구도 확인용 · 움직임은 다음 단계</div><div class="controls"><button class="foot left"><span><em>👣</em><br>왼발</span></button><button class="foot right"><span><em>👣</em><br>오른발</span></button></div></main><script>document.querySelectorAll('.foot').forEach(b=>b.addEventListener('pointerdown',()=>b.animate([{scale:1},{scale:.94},{scale:1}],{duration:160})))</script></body></html>
