<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe6" />
  <title>NEMO WORLD · CharacterLab</title>
  <link rel="stylesheet" href="./character-lab.css?v=1" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="lab-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">NEMO WORLD · V2 PROOF</p>
        <h1>CharacterLab</h1>
        <p class="subtitle">같은 각설탕이 실제 공간에서 움직이고, 모션에 맞춰 표정까지 연기하는지 확인하는 테스트.</p>
      </div>
      <div class="status"><span class="dot"></span> THREE.JS 3D</div>
    </header>

    <section class="stage-card">
      <div id="stage" class="stage" aria-label="3D 각설탕 캐릭터 실험 화면"></div>
      <div class="stage-badge">각설탕 · SUGAR 001</div>
      <div class="drag-hint">드래그해서 360° 보기 · 휠/핀치 확대</div>
    </section>

    <section class="control-card">
      <div class="section-title">
        <div>
          <p class="eyebrow">MOTION + EXPRESSION TEST</p>
          <h2>몸과 표정을 같이 확인</h2>
        </div>
        <button id="resetView" class="ghost-btn" type="button">카메라 리셋</button>
      </div>

      <div class="motion-grid" role="group" aria-label="모션 선택">
        <button class="motion-btn active" data-state="idle" type="button"><span>◻</span>가만히</button>
        <button class="motion-btn" data-state="run" type="button"><span>〰</span>아장아장</button>
        <button class="motion-btn" data-state="stumble" type="button"><span>↻</span>꽈당</button>
        <button class="motion-btn" data-state="victory" type="button"><span>★</span>승리</button>
      </div>

      <div class="tune-grid">
        <label>
          <span>아장 속도 <b id="speedValue">1.00</b></span>
          <input id="speed" type="range" min="0.6" max="1.8" step="0.05" value="1" />
        </label>
        <label>
          <span>뒤뚱 정도 <b id="waddleValue">1.00</b></span>
          <input id="waddle" type="range" min="0.2" max="2.2" step="0.05" value="1" />
        </label>
        <label>
          <span>발 들림 <b id="strideValue">1.00</b></span>
          <input id="stride" type="range" min="0.3" max="2.2" step="0.05" value="1" />
        </label>
      </div>

      <p class="note">조절 확인: <strong>속도는 발 리듬, 뒤뚱은 몸통 좌우 기울기, 발 들림은 왼발·오른발이 바닥에서 뜨는 높이가 바로 달라져야 한다.</strong></p>
    </section>
  </main>

  <script type="module" src="./character-lab.js?v=5"></script>
</body>
</html>
