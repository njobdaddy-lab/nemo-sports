<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe5" />
  <title>NEMO · Main Home Lab</title>
  <link rel="stylesheet" href="./nemo-home.css?v=1" />
</head>
<body>
  <main class="app-shell">
    <section class="top-hud">
      <div>
        <p class="eyebrow">NEMO · MAIN HOME LAB V1</p>
        <h1>내 네모</h1>
      </div>
      <div class="currencies">
        <span>🪙 <b id="coin">320</b></span>
        <span>💎 <b id="gem">12</b></span>
      </div>
    </section>

    <section class="hero-room">
      <div class="room-bg">
        <div class="window"><span></span><span></span><span></span><span></span></div>
        <div class="shelf"><i></i><i></i><i></i></div>
        <div class="desk"></div>
        <div class="rug"></div>
      </div>

      <div class="profile-chip">
        <span>대표 네모</span>
        <strong id="nemoName">슈가</strong>
        <small>Lv.<b id="level">1</b></small>
      </div>

      <button id="idleReward" class="idle-reward" type="button">
        <span>방치 보상</span>
        <strong>받기</strong>
      </button>

      <div class="nemo-stage" aria-label="대표 네모">
        <div id="nemo" class="nemo skin-cream">
          <div id="hat" class="hat hat-none"></div>
          <div class="face">
            <i class="eye left"></i><i class="eye right"></i>
            <i class="cheek left"></i><i class="cheek right"></i>
            <i class="mouth"></i>
          </div>
          <div class="arm left"></div><div class="arm right"></div>
          <div class="leg left"></div><div class="leg right"></div>
        </div>
        <div class="shadow"></div>
      </div>

      <div class="power-card">
        <span>POWER</span>
        <strong id="power">1,240</strong>
        <div class="xp-bar"><i id="xpFill"></i></div>
        <small>EXP <b id="xp">18</b> / <b id="xpNeed">100</b></small>
      </div>

      <div class="side-actions">
        <button id="growBtn" type="button"><b>⬆</b><span>성장</span></button>
        <button id="dressBtn" type="button"><b>✦</b><span>꾸미기</span></button>
        <button id="collectionBtn" type="button"><b>▦</b><span>네모</span></button>
      </div>

      <button id="playBtn" class="play-button" type="button">
        <span>PLAY</span>
        <strong>게임하러 가기</strong>
      </button>
    </section>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button class="active" type="button"><b>⌂</b><span>홈</span></button>
      <button type="button"><b>★</b><span>미션</span></button>
      <button type="button"><b>▣</b><span>상점</span></button>
      <button type="button"><b>☰</b><span>메뉴</span></button>
    </nav>
  </main>

  <div id="playSheet" class="sheet" aria-hidden="true">
    <button class="sheet-backdrop" data-close="play" aria-label="닫기"></button>
    <section class="sheet-card">
      <div class="sheet-head"><div><p>PLAY</p><h2>어디서 놀까?</h2></div><button data-close="play" type="button">×</button></div>
      <a class="mode-card race" href="./race-lab.html?v=9">
        <div class="mode-icon">🏁</div><div><strong>레이싱</strong><span>드리프트 · 충돌 · 부스트</span></div><b>›</b>
      </a>
      <a class="mode-card run" href="../index.html?v=110">
        <div class="mode-icon">🏃</div><div><strong>100m 달리기</strong><span>리듬 · 스타트 · 스퍼트</span></div><b>›</b>
      </a>
      <button class="mode-card locked" type="button"><div class="mode-icon">?</div><div><strong>다음 경기</strong><span>아직 만들지 않음</span></div><b>🔒</b></button>
      <p class="sheet-note">지금은 종목을 늘리지 않고, 홈 → 경기 → 보상 → 성장 흐름만 확인합니다.</p>
    </section>
  </div>

  <div id="dressSheet" class="sheet" aria-hidden="true">
    <button class="sheet-backdrop" data-close="dress" aria-label="닫기"></button>
    <section class="sheet-card">
      <div class="sheet-head"><div><p>CUSTOMIZE</p><h2>내 네모 꾸미기</h2></div><button data-close="dress" type="button">×</button></div>
      <h3>몸 색</h3>
      <div class="choices" id="skinChoices">
        <button data-skin="cream" class="choice cream active" type="button">크림</button>
        <button data-skin="pink" class="choice pink" type="button">핑크</button>
        <button data-skin="mint" class="choice mint" type="button">민트</button>
      </div>
      <h3>모자</h3>
      <div class="choices" id="hatChoices">
        <button data-hat="none" class="choice active" type="button">없음</button>
        <button data-hat="cap" class="choice" type="button">캡</button>
        <button data-hat="crown" class="choice" type="button">왕관</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="./nemo-home.js?v=1"></script>
</body>
</html>
