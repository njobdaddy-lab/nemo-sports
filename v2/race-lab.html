<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dff2ff" />
  <title>NEMO WORLD · RaceLab</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#657083;--line:rgba(23,32,51,.11);--deep:#2c6ea8}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:Inter,"Pretendard","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#eef8ff,#f7f0e4 70%,#edf4ed);color:var(--ink)}
    body{padding:10px}button{font:inherit}.shell{width:min(1100px,100%);margin:0 auto;display:grid;gap:10px}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 4px 0}.eyebrow{margin:0 0 4px;font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--deep)}h1{margin:0;font-size:clamp(27px,6vw,48px);line-height:1;letter-spacing:-.05em}.sub{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.reset{border:1px solid var(--line);background:rgba(255,255,255,.82);border-radius:14px;padding:10px 13px;font-weight:900;color:var(--ink);cursor:pointer}.game-card{position:relative;overflow:hidden;border-radius:26px;border:1px solid rgba(255,255,255,.95);background:#cfeafa;box-shadow:0 18px 55px rgba(40,55,70,.14)}#stage{width:100%;height:min(70vh,700px);min-height:470px;touch-action:none}#stage canvas{display:block;width:100%;height:100%}.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}.hud-group{display:flex;gap:8px;flex-wrap:wrap}.pill{background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:950;box-shadow:0 6px 18px rgba(25,40,55,.08)}.pill b{color:var(--deep)}.speed{min-width:84px;text-align:center}.message{position:absolute;left:50%;top:17%;transform:translateX(-50%);pointer-events:none;text-align:center;font-weight:1000;letter-spacing:-.04em;color:white;text-shadow:0 3px 10px rgba(22,34,48,.4);font-size:clamp(34px,10vw,72px);opacity:0;transition:opacity .12s}.message.show{opacity:1}.mini{position:absolute;left:50%;top:29%;transform:translateX(-50%);pointer-events:none;background:rgba(20,31,45,.72);color:white;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:850;opacity:0;transition:opacity .15s;white-space:nowrap}.mini.show{opacity:1}.controls{position:absolute;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:18px;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(2,62px);gap:10px;pointer-events:auto}.actions{display:grid;grid-template-columns:78px;gap:10px;pointer-events:auto}.ctrl{height:62px;border:1px solid rgba(255,255,255,.85);border-radius:21px;background:rgba(255,255,255,.74);backdrop-filter:blur(10px);box-shadow:0 9px 22px rgba(28,43,58,.14);font-weight:1000;color:#24344a;touch-action:none;user-select:none;cursor:pointer}.ctrl:active,.ctrl.on{transform:translateY(2px) scale(.97);background:rgba(219,240,255,.92)}.gas{height:78px;background:rgba(225,248,234,.88);color:#17683c}.drift{height:56px;background:rgba(255,241,212,.9);color:#7b4a05}.finish{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,24,34,.38);backdrop-filter:blur(5px);padding:22px}.finish.show{display:flex}.finish-card{width:min(360px,92%);border-radius:26px;background:rgba(255,255,255,.95);padding:23px;text-align:center;box-shadow:0 20px 60px rgba(15,24,34,.2)}.finish-card p{margin:0;color:var(--muted);font-size:12px;font-weight:850}.finish-card h2{margin:5px 0 3px;font-size:46px;letter-spacing:-.06em}.finish-card strong{display:block;font-size:15px;margin-bottom:15px}.finish-card button{width:100%;border:0;border-radius:16px;padding:13px;background:#2f7fb9;color:white;font-weight:950;cursor:pointer}.note{margin:0;padding:2px 6px;color:var(--muted);font-size:11px;line-height:1.45}
    @media(max-width:680px){body{padding:0;background:#cfeafa}.shell{gap:0}.topbar{display:none}.game-card{border:0;border-radius:0;box-shadow:none}#stage{height:78vh;min-height:560px}.controls{padding-left:10px;padding-right:10px}.note{background:#f6f3ec;padding:10px 12px}}
    @media(max-width:380px){.pad{grid-template-columns:repeat(2,56px)}.ctrl{height:56px;border-radius:18px}.actions{grid-template-columns:72px}.gas{height:72px}.hud{left:8px;right:8px;top:8px}.pill{padding:7px 9px;font-size:11px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div><p class="eyebrow">NEMO WORLD · FIRST RACING PROOF</p><h1>RaceLab</h1><p class="sub">각설탕 자체가 머신이 된다. 바퀴 + 마후라 + 드리프트만으로 “한 판 더”가 나오는지 보는 테스트.</p></div><button id="resetTop" class="reset" type="button">처음부터</button></header>
    <section class="game-card">
      <div id="stage" aria-label="네모 레이싱 3D 테스트"></div>
      <div class="hud"><div class="hud-group"><div class="pill">LAP <b id="lap">1 / 2</b></div><div class="pill">RANK <b id="rank">1 / 4</b></div></div><div class="pill speed"><b id="speed">0</b> km/h</div></div>
      <div id="message" class="message">3</div><div id="mini" class="mini">DRIFT BOOST!</div>
      <div class="controls"><div class="pad" aria-label="방향 조작"><button id="left" class="ctrl" type="button" aria-label="왼쪽">◀</button><button id="right" class="ctrl" type="button" aria-label="오른쪽">▶</button></div><div class="actions"><button id="drift" class="ctrl drift" type="button">DRIFT</button><button id="gas" class="ctrl gas" type="button">가속</button></div></div>
      <div id="finish" class="finish"><div class="finish-card"><p>FINISH</p><h2 id="finishRank">1위</h2><strong id="finishTime">00:00.00</strong><button id="retry" type="button">한 판 더</button></div></div>
    </section>
    <p class="note">모바일: ◀ ▶ + 가속, 코너에서 DRIFT를 누르고 돌다가 놓으면 짧은 부스터. PC: ← → / ↑ 또는 W / Space. 지금은 재미 검증용이라 캐릭터 성장·상점·멀티는 넣지 않음.</p>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    const stage=document.querySelector('#stage');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;stage.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0xcfeafa);scene.fog=new THREE.Fog(0xcfeafa,24,48);const camera=new THREE.PerspectiveCamera(48,1,.1,120);camera.position.set(-4,5.5,-8);scene.add(new THREE.HemisphereLight(0xffffff,0xa7b88e,2.3));const sun=new THREE.DirectionalLight(0xfff5df,4.1);sun.position.set(-8,14,-6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;scene.add(sun);const grass=new THREE.Mesh(new THREE.CircleGeometry(32,96),new THREE.MeshStandardMaterial({color:0xb9d69a,roughness:.96}));grass.rotation.x=-Math.PI/2;grass.receiveShadow=true;scene.add(grass);
    const outerRX=11,outerRZ=7,innerRX=5.3,innerRZ=2.65,centerRX=8.15,centerRZ=4.75;function ellipsePath(rx,rz,y,color){const curve=new THREE.EllipseCurve(0,0,rx,rz,0,Math.PI*2,false,0),pts=curve.getPoints(180).map(p=>new THREE.Vector3(p.x,y,p.y));return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color}));}const roadShape=new THREE.Shape();roadShape.absellipse(0,0,outerRX,outerRZ,0,Math.PI*2,false,0);const hole=new THREE.Path();hole.absellipse(0,0,innerRX,innerRZ,0,Math.PI*2,true,0);roadShape.holes.push(hole);const road=new THREE.Mesh(new THREE.ShapeGeometry(roadShape,128),new THREE.MeshStandardMaterial({color:0x59616b,roughness:.9}));road.rotation.x=-Math.PI/2;road.position.y=.025;road.receiveShadow=true;scene.add(road);scene.add(ellipsePath(outerRX-.18,outerRZ-.18,.045,0xf6f1e9),ellipsePath(innerRX+.18,innerRZ+.18,.045,0xf6f1e9));const dashMat=new THREE.MeshStandardMaterial({color:0xffefd0,roughness:.8});for(let i=0;i<36;i++){const a=i/36*Math.PI*2,x=centerRX*Math.cos(a),z=centerRZ*Math.sin(a),tangent=Math.atan2(centerRZ*Math.cos(a),-centerRX*Math.sin(a));const dash=new THREE.Mesh(new THREE.BoxGeometry(.62,.025,.09),dashMat);dash.position.set(x,.055,z);dash.rotation.y=-tangent;dash.receiveShadow=true;scene.add(dash);}const startMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.75});for(let i=-3;i<=3;i++){const tile=new THREE.Mesh(new THREE.BoxGeometry(.55,.03,.42),startMat);tile.position.set(i*.55,.065,-centerRZ);tile.receiveShadow=true;scene.add(tile);}
    const mats={sugar:new THREE.MeshStandardMaterial({color:0xf3e8cf,roughness:.9}),black:new THREE.MeshStandardMaterial({color:0x17191e,roughness:.48}),wheel:new THREE.MeshStandardMaterial({color:0x202329,roughness:.62}),rim:new THREE.MeshStandardMaterial({color:0xcbd4dc,roughness:.3,metalness:.6}),chrome:new THREE.MeshStandardMaterial({color:0x88939c,roughness:.25,metalness:.8}),eye:new THREE.MeshPhysicalMaterial({color:0x090a0d,roughness:.12,clearcoat:.75}),white:new THREE.MeshBasicMaterial({color:0xffffff})};function mesh(g,m,c=true){const o=new THREE.Mesh(g,m);o.castShadow=c;o.receiveShadow=c;return o;}function makeRacer(color=0xf3e8cf,isPlayer=false){const root=new THREE.Group(),visual=new THREE.Group();root.add(visual);const body=mesh(new RoundedBoxGeometry(1.18,.98,1.34,6,.13),isPlayer?mats.sugar:new THREE.MeshStandardMaterial({color,roughness:.82}));body.position.y=.88;visual.add(body);const face=new THREE.Group();face.position.set(0,.94,.69);visual.add(face);for(const x of[-.2,.2]){const eye=mesh(new THREE.SphereGeometry(.095,18,14),mats.eye);eye.scale.set(.85,1.15,.32);eye.position.set(x,.08,.015);face.add(eye);const shine=mesh(new THREE.SphereGeometry(.022,10,8),mats.white,false);shine.position.set(x-.025,.115,.052);face.add(shine);}const mouth=mesh(new THREE.TorusGeometry(.09,.018,8,24,Math.PI),mats.black,false);mouth.rotation.z=Math.PI;mouth.position.set(0,-.12,.03);face.add(mouth);const wheelGeo=new THREE.CylinderGeometry(.19,.19,.16,18);for(const sx of[-1,1])for(const sz of[-1,1]){const wheel=mesh(wheelGeo,mats.wheel);wheel.rotation.z=Math.PI/2;wheel.position.set(sx*.58,.36,sz*.42);visual.add(wheel);const rim=mesh(new THREE.CylinderGeometry(.095,.095,.164,18),mats.rim);rim.rotation.z=Math.PI/2;rim.position.copy(wheel.position);visual.add(rim);}for(const x of[-.25,.25]){const pipe=mesh(new THREE.CylinderGeometry(.07,.09,.34,14),mats.chrome);pipe.rotation.x=Math.PI/2;pipe.position.set(x,.52,-.78);visual.add(pipe);}const spoiler=mesh(new RoundedBoxGeometry(.72,.08,.12,4,.03),mats.black);spoiler.position.set(0,1.18,-.66);visual.add(spoiler);root.userData.visual=visual;scene.add(root);return root;}
    const player=makeRacer(0xf3e8cf,true);player.position.set(0,.02,-centerRZ);player.rotation.y=Math.PI/2;const aiDefs=[{color:0xb95d48,speed:8.15,lane:-.55,offset:-.55},{color:0xf48ab1,speed:8.5,lane:.15,offset:-1.1},{color:0xc99c62,speed:8.8,lane:.62,offset:-1.65}],ais=aiDefs.map((d,i)=>{const o=makeRacer(d.color,false);o.userData.def=d;o.userData.progress=d.offset;o.userData.lapProgress=d.offset;o.userData.seed=i*2.1;return o;});
    const input={left:false,right:false,gas:false,drift:false};let yaw=Math.PI/2,speed=0,driftCharge=0,boostTimer=0,wasDrifting=false,cumulative=0,lastTheta=-Math.PI/2,raceState='countdown',raceStart=0,countdownStart=performance.now()/1000;const lapEl=document.querySelector('#lap'),rankEl=document.querySelector('#rank'),speedEl=document.querySelector('#speed'),msg=document.querySelector('#message'),mini=document.querySelector('#mini'),finish=document.querySelector('#finish'),finishRank=document.querySelector('#finishRank'),finishTime=document.querySelector('#finishTime');function normalizeAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}function trackState(x,z){const outer=x*x/(outerRX*outerRX)+z*z/(outerRZ*outerRZ),inner=x*x/(innerRX*innerRX)+z*z/(innerRZ*innerRZ);return{on:outer<=1&&inner>=1,outer,inner};}function showMini(text){mini.textContent=text;mini.classList.add('show');clearTimeout(showMini.t);showMini.t=setTimeout(()=>mini.classList.remove('show'),700);}function bindHold(id,key){const el=document.querySelector(id),on=e=>{e.preventDefault();input[key]=true;el.classList.add('on')},off=e=>{e.preventDefault();input[key]=false;el.classList.remove('on')};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);}bindHold('#left','left');bindHold('#right','right');bindHold('#gas','gas');bindHold('#drift','drift');addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))input.left=true;if(['ArrowRight','d','D'].includes(e.key))input.right=true;if(['ArrowUp','w','W'].includes(e.key))input.gas=true;if(e.code==='Space'){input.drift=true;e.preventDefault()}if(e.key==='r'||e.key==='R')resetRace()});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))input.left=false;if(['ArrowRight','d','D'].includes(e.key))input.right=false;if(['ArrowUp','w','W'].includes(e.key))input.gas=false;if(e.code==='Space')input.drift=false});
    function resetRace(){player.position.set(0,.02,-centerRZ);yaw=Math.PI/2;player.rotation.y=yaw;player.userData.visual.rotation.set(0,0,0);speed=0;driftCharge=0;boostTimer=0;wasDrifting=false;cumulative=0;lastTheta=-Math.PI/2;raceState='countdown';countdownStart=performance.now()/1000;raceStart=0;finish.classList.remove('show');ais.forEach((a,i)=>{a.userData.progress=aiDefs[i].offset;a.userData.lapProgress=aiDefs[i].offset})}document.querySelector('#retry').addEventListener('click',resetRace);document.querySelector('#resetTop').addEventListener('click',resetRace);function updateCountdown(now){if(raceState!=='countdown')return;const e=now-countdownStart;let text='';if(e<1)text='3';else if(e<2)text='2';else if(e<3)text='1';else if(e<3.7)text='GO!';else{msg.classList.remove('show');raceState='racing';raceStart=now;return}msg.textContent=text;msg.classList.add('show')}
    function updatePlayer(dt,now){const active=raceState==='racing',steer=(input.left?-1:0)+(input.right?1:0),t=trackState(player.position.x,player.position.z),drifting=active&&input.drift&&Math.abs(steer)>.1&&speed>3.6;if(active&&input.gas)speed+=(boostTimer>0?10.5:7.2)*dt;else speed-=3.2*dt;speed=THREE.MathUtils.clamp(speed,0,boostTimer>0?13.6:(t.on?10.3:4.4));if(boostTimer>0)boostTimer=Math.max(0,boostTimer-dt);if(drifting)driftCharge=Math.min(1.6,driftCharge+dt*.95);if(wasDrifting&&!drifting&&driftCharge>.32){boostTimer=.42+Math.min(.75,driftCharge*.45);showMini('DRIFT BOOST!');driftCharge=0}if(!drifting&&!wasDrifting)driftCharge=Math.max(0,driftCharge-dt*.4);wasDrifting=drifting;if(active&&speed>.15){const steerRate=drifting?1.72:1.15;yaw+=steer*steerRate*dt*(.45+speed/10)}const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));player.position.addScaledVector(f,speed*dt);if(t.outer>1.22){player.position.multiplyScalar(.998);speed*=.94}if(t.inner<.72)speed*=.90;player.rotation.y=yaw;const visual=player.userData.visual;visual.rotation.z=THREE.MathUtils.lerp(visual.rotation.z,-steer*(drifting?.22:.08),.14);visual.rotation.x=THREE.MathUtils.lerp(visual.rotation.x,boostTimer>0?-.08:0,.12);visual.position.y=Math.sin(now*18)*Math.min(speed/10,.055);const theta=Math.atan2(player.position.z/centerRZ,player.position.x/centerRX),delta=normalizeAngle(theta-lastTheta);if(Math.abs(delta)<.35)cumulative+=delta;lastTheta=theta;lapEl.textContent=`${THREE.MathUtils.clamp(Math.floor(Math.max(0,cumulative)/(Math.PI*2))+1,1,2)} / 2`;speedEl.textContent=Math.round(speed*13.2);if(active&&cumulative>=Math.PI*4){raceState='finished';speed*=.5;const r=computeRank();finishRank.textContent=`${r}위`;finishTime.textContent=formatTime(now-raceStart);finish.classList.add('show')}}
    function updateAI(dt,now){const active=raceState==='racing';for(const ai of ais){if(active){const d=ai.userData.def,w=1+Math.sin(now*.85+ai.userData.seed)*.035;ai.userData.progress+=(d.speed*w/6.45)*dt;ai.userData.lapProgress=ai.userData.progress}const d=ai.userData.def,a=-Math.PI/2+ai.userData.progress,rx=centerRX+d.lane,rz=centerRZ+d.lane*.45;ai.position.set(rx*Math.cos(a),.02,rz*Math.sin(a));const tx=-rx*Math.sin(a),tz=rz*Math.cos(a);ai.rotation.y=Math.atan2(tx,tz);ai.userData.visual.rotation.z=Math.sin(now*2.2+ai.userData.seed)*.025;ai.userData.visual.position.y=Math.sin(now*15+ai.userData.seed)*.025}}function computeRank(){const p=Math.max(0,cumulative),vals=[p,...ais.map(a=>Math.max(0,a.userData.lapProgress))],sorted=[...vals].sort((a,b)=>b-a);return sorted.indexOf(p)+1}function updateRank(){rankEl.textContent=`${computeRank()} / 4`}function updateCamera(dt){const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),desired=player.position.clone().addScaledVector(f,-6.2).add(new THREE.Vector3(0,4.2,0)),alpha=1-Math.pow(.001,dt);camera.position.lerp(desired,alpha);camera.lookAt(player.position.clone().addScaledVector(f,3).add(new THREE.Vector3(0,.8,0)))}function formatTime(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60),cs=Math.floor((sec-Math.floor(sec))*100);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`}function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033),now=performance.now()/1000;updateCountdown(now);updatePlayer(dt,now);updateAI(dt,now);updateRank();updateCamera(dt);renderer.render(scene,camera)}resetRace();animate();
  </script>
