<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dff2ff" />
  <title>NEMO WORLD · RaceLab V8</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="./race-lab.css?v=8" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">NEMO WORLD · ARCADE DRIVING V3</p><h1>RaceLab</h1><p class="sub">넓은 도로와 긴 출발 직선으로 주행 · 추월 · 드리프트 라인을 제대로 확인하는 테스트 트랙.</p></div>
      <button id="resetTop" class="reset" type="button">처음부터</button>
    </header>
    <section class="game-card">
      <div id="stage" aria-label="네모 레이싱 3D 테스트"></div>
      <div class="hud"><div class="hud-group"><div class="pill">LAP <b id="lap">1 / 2</b></div><div class="pill">RANK <b id="rank">1 / 4</b></div></div><div class="pill speed"><b id="speed">0</b> km/h</div></div>
      <div id="message" class="message">3</div><div id="mini" class="mini">DRIFT!</div>
      <div class="boost-hud" aria-label="부스터 게이지"><div class="boost-line"><span>DRIFT GAUGE</span><span><b id="boostPct">0</b>% · BOOST <b id="boostStock">0</b></span></div><div class="boost-bar"><div id="boostFill" class="boost-fill"></div><div id="boostPending" class="boost-pending"></div></div></div>
      <div class="controls">
        <div class="pad" aria-label="방향 조작"><button id="left" class="ctrl" type="button" aria-label="왼쪽">◀</button><button id="right" class="ctrl" type="button" aria-label="오른쪽">▶</button></div>
        <div class="actions"><button id="boost" class="ctrl boost" type="button" disabled>BOOST</button><button id="drift" class="ctrl drift" type="button">DRIFT</button><button id="gas" class="ctrl gas" type="button">가속</button></div>
      </div>
      <div id="finish" class="finish"><div class="finish-card"><p>FINISH</p><h2 id="finishRank">1위</h2><strong id="finishTime">00:00.00</strong><button id="retry" type="button">한 판 더</button></div></div>
    </section>
    <p class="note">V8: 모바일 ◀ / ▶ 조작 버튼을 더 크게 만들고 사이 간격도 넓혀 엄지 조작이 편하도록 수정. V7의 지면 접촉·넓은 도로·긴 출발 직선·드리프트 게이지/수동 BOOST는 그대로 유지.</p>
  </main>

  <script type="module" src="./race-lab.js?v=7"></script>
</body>
</html>
